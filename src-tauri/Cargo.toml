[package]
name = "job-search-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Local desktop-first job search assistant"
authors = ["Job Search Tool"]
license = "MIT"

[lib]
name = "job_search_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "job-search-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Secrets
keyring = "3"

# HTTP + parsing
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
scraper = "0.20"
url = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Web server
axum = { version = "0.7", features = ["json", "query", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = "0.4"

# Errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
once_cell = "1"
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
directories = "5"
handlebars = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
